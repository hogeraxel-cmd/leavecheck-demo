      importar(b64(guardada.llave)).then(abrir).catch(function () { localStorage.removeItem(LLAVE); });
    } else if (guardada) { localStorage.removeItem(LLAVE); }
  } catch (e) {}
  document.getElementById("acceso").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var boton = document.getElementById("entrar"), error = document.getElementById("error");
    boton.disabled = true; error.textContent = "Abriendo…";
    var clave = new TextEncoder().encode(document.getElementById("clave").value);
    crypto.subtle.importKey("raw", clave, "PBKDF2", false, ["deriveBits"]).then(function (base) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(D.sal), iterations: D.iteraciones, hash: "SHA-256" }, base, 256);
    }).then(function (bits) {
      if (document.getElementById("recordar").checked) {
        try { localStorage.setItem(LLAVE, JSON.stringify({ llave: aB64(bits), vence: Date.now() + 7 * 864e5 })); } catch (e) {}
      }
      return importar(bits).then(abrir);
    }).catch(function () {
      boton.disabled = false; error.textContent = "Clave incorrecta. Inténtalo de nuevo.";
      document.getElementById("clave").select();
    });
  });
})();
</script>
